<div class="form-prompt-setup" data-local-creation data-compact="true" data-target="draft-prompt" data-organization="{{ organization.slug }}">
  <div class="form-prompt-composer">
    <textarea id="draft-prompt" rows="3" maxlength="4000" aria-label="Describe your form" placeholder="Create an order form with a menu, customer name, and pickup time. Let people choose quantities and add a note."></textarea>
    <div class="form-prompt-toolbar"><button type="button" id="draft-form">Draft form <span aria-hidden="true">↑</span></button></div>
  </div>
  <div class="builder-prompt-actions">
    <details class="form-prompt-model-options"><summary>AI model</summary><div class="form-prompt-models"><label>Model <select data-creation-model aria-label="Model for form drafting"><option value="">Loading models…</option></select></label></div></details>
    <button type="button" class="button tertiary" data-step-next="structure" data-prompt-manual>Build manually</button>
  </div>
  <p class="form-prompt-creation-status" data-creation-status role="status"></p>
</div>
